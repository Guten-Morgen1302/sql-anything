services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: saas
    ports:
      - "54330:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d saas"]
      interval: 2s
      timeout: 3s
      retries: 30
    # No volume on purpose: `docker compose down` gives you a clean database next time.
